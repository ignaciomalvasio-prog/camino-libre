<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="description" content="Mapa colaborativo de presencia policial y siniestros viales en las rutas de la provincia de Cordoba.">
<meta name="theme-color" content="#0f1216">
<title>Camino Libre — rutas de Córdoba</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#0f1216; color:#e8eaee; }
  #app{ display:flex; height:100%; }
  #panel{ width:340px; flex-shrink:0; display:flex; flex-direction:column;
    background:#141920; border-right:1px solid #232a34; }
  #mapa{ flex:1; background:#0f1216; }

  .cab{ padding:16px 18px 13px; border-bottom:1px solid #232a34;
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  h1{ font-size:16px; margin:0 0 3px; font-weight:500; letter-spacing:-.01em; }
  .sub{ font-size:11.5px; color:#7d879a; }
  .punto{ width:7px; height:7px; border-radius:50%; background:#1baf7a; flex-shrink:0; margin-top:6px; }

  .chips{ display:flex; gap:6px; flex-wrap:wrap; padding:13px 18px 0; }
  .chip{ font-size:12.5px; padding:6px 12px; border-radius:20px; cursor:pointer;
    border:1px solid #2c3542; background:transparent; color:#8b95a7;
    transition:.12s; user-select:none; white-space:nowrap; }
  .chip:active{ transform:scale(.96); }
  .on-cam{ background:rgba(239,159,39,.16); border-color:#EF9F27; color:#EF9F27; }
  .on-cho{ background:rgba(226,75,74,.16); border-color:#E24B4A; color:#E24B4A; }
  .on-ven{ background:rgba(180,178,169,.16); border-color:#B4B2A9; color:#B4B2A9; }
  .on-rut{ background:rgba(55,138,221,.16); border-color:#378ADD; color:#378ADD; }

  .kpis{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:13px 18px; }
  .kpi{ background:#1a212b; border-radius:8px; padding:9px 11px; }
  .kpi .lab{ font-size:10.5px; color:#7d879a; margin-bottom:2px; }
  .kpi .val{ font-size:20px; font-weight:500; font-variant-numeric:tabular-nums; }

  .seccion{ font-size:10.5px; text-transform:uppercase; letter-spacing:.09em;
    color:#6d7789; padding:5px 18px 8px; }
  #lista{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 18px 16px; }
  .item{ padding:10px 12px; background:#1a212b; border-left:3px solid #444;
    margin-bottom:6px; cursor:pointer; transition:.12s; }
  .item:active{ background:#212a36; }
  .item.cam{ border-left-color:#EF9F27; }
  .item.cho{ border-left-color:#E24B4A; }
  .item.venc{ opacity:.5; border-left-color:#B4B2A9; }
  .item .t{ font-size:13px; font-weight:500; }
  .item .t span{ color:#8b95a7; font-weight:400; }
  .item .m{ font-size:11.5px; color:#6d7789; margin-top:3px; line-height:1.45; }
  .vacio{ font-size:12px; color:#5d6675; padding:10px 0; }
  .item .lv{ font-size:11px; color:#7dd3a8; margin-top:5px; line-height:1.4;
    border-top:1px solid #232a34; padding-top:5px; }
  .pl{ font-size:11.5px; color:#7dd3a8; margin-top:7px; border-top:1px solid #2c3542;
    padding-top:6px; line-height:1.45; }

  .pie{ padding:11px 18px; border-top:1px solid #232a34; font-size:10.5px;
    color:#5d6675; line-height:1.5; }
  .pie a{ color:#7d879a; }

  #tirador{ display:none; }
  .leaflet-container{ background:#0f1216; font-family:inherit; }
  .leaflet-popup-content-wrapper{ background:#1a212b; color:#e8eaee; border-radius:8px; }
  .leaflet-popup-tip{ background:#1a212b; }
  .leaflet-popup-content{ margin:12px 14px; font-size:13px; line-height:1.55; }
  .pt{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:500; }
  .px{ font-style:italic; color:#a8b1c0; margin:6px 0; }
  .pm{ font-size:11.5px; color:#7d879a; }
  .leaflet-bar a{ background:#1a212b; color:#e8eaee; border-bottom-color:#2c3542; }
  .leaflet-bar a:hover{ background:#212a36; }
  .leaflet-control-attribution{ background:rgba(20,25,32,.85); color:#6d7789; font-size:10px; }
  .leaflet-control-attribution a{ color:#8b95a7; }
  .leaflet-control-layers{ background:#1a212b; color:#e8eaee; border:1px solid #2c3542; }
  .leaflet-control-layers-expanded{ padding:8px 12px 8px 8px; font-size:13px; }
  .leaflet-control-scale-line{ background:rgba(20,25,32,.85); border-color:#3d4757; color:#a8b1c0; }

  @media (max-width:820px){
    #app{ flex-direction:column; }
    #mapa{ order:1; flex:1 1 auto; min-height:0; }
    #panel{ order:2; width:100%; height:52vh; max-height:52vh;
      border-right:none; border-top:1px solid #232a34;
      border-radius:14px 14px 0 0; margin-top:-14px; position:relative; z-index:500; }
    #tirador{ display:block; width:38px; height:4px; border-radius:2px;
      background:#3d4757; margin:8px auto 0; }
    .cab{ padding:10px 16px 11px; }
    h1{ font-size:15px; }
    .kpis{ padding:11px 16px; }
    .chips{ padding:11px 16px 0; overflow-x:auto; flex-wrap:nowrap; scrollbar-width:none; }
    .chips::-webkit-scrollbar{ display:none; }
    #lista{ padding:0 16px 14px; }
    .seccion{ padding:4px 16px 7px; }
    .pie{ padding:9px 16px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="mapa"></div>
  <div id="panel">
    <div id="tirador"></div>
    <div class="cab">
      <div>
        <h1>Camino Libre</h1>
        <div class="sub" id="sub">Cargando&hellip;</div>
      </div>
      <div class="punto" id="punto"></div>
    </div>
    <div class="chips">
      <div class="chip" data-k="CAMINERA">Caminera</div>
      <div class="chip" data-k="CHOQUE">Choques</div>
      <div class="chip" data-k="VENC">Vencidos</div>
      <div class="chip" data-k="RUTAS">Trazado</div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="lab">Vigentes</div><div class="val" id="k-vig">0</div></div>
      <div class="kpi"><div class="lab">Caminera</div><div class="val" id="k-cam" style="color:#EF9F27">0</div></div>
      <div class="kpi"><div class="lab">Choques</div><div class="val" id="k-cho" style="color:#E24B4A">0</div></div>
    </div>
    <div class="seccion">Reportes &mdash; toc&aacute; para acercar</div>
    <div id="lista"></div>
    <div class="pie">
      Caminera vence a las 2&nbsp;h, choques a las 4&nbsp;h. Reportes de usuarios,
      sin verificar. Ubicaci&oacute;n aproximada. No uses el celular manejando.
    </div>
  </div>
</div>

<script src="datos.js"></script>
<script>
(function(){
  var D = window.DATOS || { generado:null, reportes:[], rutas:[] };
  var REPORTES = D.reportes, RUTAS = D.rutas;

  var mapa = L.map('mapa', { zoomControl:false, minZoom:5, maxZoom:19, tap:true })
              .setView([-31.7,-63.8], 7);

  var calles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OpenStreetMap', maxZoom:19, maxNativeZoom:19 });
  var relieve = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OpenStreetMap, SRTM &mdash; OpenTopoMap', maxZoom:17, maxNativeZoom:17 });
  calles.addTo(mapa);

  L.control.zoom({ position:'topright' }).addTo(mapa);
  L.control.layers({ 'Calles':calles, 'Relieve':relieve }, null, { position:'topright' }).addTo(mapa);
  L.control.scale({ position:'bottomleft', imperial:false }).addTo(mapa);

  var capaRutas = L.layerGroup();
  RUTAS.forEach(function(r){
    L.polyline(r.puntos, { color:r.color, weight:3, opacity:.5 })
      .bindTooltip(r.nombre, { sticky:true })
      .on('click', function(e){ L.DomEvent.stop(e);
        mapa.fitBounds(L.latLngBounds(r.puntos).pad(.12)); })
      .addTo(capaRutas);
  });
  capaRutas.addTo(mapa);

  var COL = { CAMINERA:'#EF9F27', CHOQUE:'#E24B4A', OFF:'#B4B2A9' };
  var capaMarcas = L.layerGroup().addTo(mapa);
  var marcas = {};

  function color(r){ return r.vigente ? COL[r.tipo] : COL.OFF; }
  function dosd(n){ return (n<10?'0':'')+n; }
  function hora(iso){ var d=new Date(iso); return dosd(d.getHours())+':'+dosd(d.getMinutes()); }
  function edad(m){
    if(m<60) return 'hace '+m+' min';
    var h=Math.floor(m/60);
    if(h<24) return 'hace '+h+' h'+(m%60?' '+(m%60)+' min':'');
    return 'hace '+Math.floor(h/24)+' d';
  }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

  REPORTES.forEach(function(r){
    var m = L.circleMarker([r.lat,r.lon], {
      radius: r.vigente?9:6, fillColor:color(r), color:'#0f1216',
      weight:2.5, fillOpacity:r.vigente?.95:.5 });
    m.bindPopup(
      '<div class="ptindex.html" style="color:'+color(r)+'">'+
        (r.tipo==='CHOQUE'?'Siniestro vial':'Presencia policial')+
        (r.vigente?'':' &mdash; vencido')+'</div>'+
      '<div style="margin-top:4px"><b>'+esc(r.ruta||'ruta sin identificar')+'</b> &middot; '+esc(r.referencia||'')+'</div>'+
      (r.sentido?'<div class="pm">Sentido: '+esc(r.sentido)+'</div>':'')+
      '<div class="px">&ldquo;'+esc(r.texto)+'&rdquo;</div>'+
      '<div class="pm">Reportado '+hora(r.fecha)+' &middot; '+edad(r.minutos)+
        '<br>Confianza de ubicaci&oacute;n: '+esc(r.confianza)+'</div>'+
      (r.levantado_hora ? '<div class="pl">Avisaron que se fue a las '+esc(r.levantado_hora)+
        '<br>&ldquo;'+esc(r.levantado_texto)+'&rdquo;</div>' : ''));
    marcas[r.id] = m;
  });

  var on = { CAMINERA:true, CHOQUE:true, VENC:false, RUTAS:true };
  var CLASE = { CAMINERA:'on-cam', CHOQUE:'on-cho', VENC:'on-ven', RUTAS:'on-rut' };

  function visible(r){
    if(!on[r.tipo]) return false;
    if(!r.vigente && !on.VENC) return false;
    return true;
  }

  function acercar(r){
    mapa.flyTo([r.lat,r.lon], 13, { duration:.7 });
    setTimeout(function(){ marcas[r.id].openPopup(); }, 720);
    if(window.innerWidth <= 820) document.getElementById('mapa').scrollIntoView({behavior:'smooth'});
  }

  function pintar(){
    capaMarcas.clearLayers();
    var lista = document.getElementById('lista');
    lista.innerHTML = '';
    var vis = REPORTES.filter(visible);

    vis.forEach(function(r){
      capaMarcas.addLayer(marcas[r.id]);
      var d = document.createElement('div');
      d.className = 'item ' + (r.tipo==='CHOQUE'?'cho':'cam') + (r.vigente?'':' venc');
      d.innerHTML = '<div class="t">'+esc(r.ruta||'?')+' <span>&middot; '+esc(r.referencia||'')+'</span></div>'+
        '<div class="m">&ldquo;'+esc(r.texto)+'&rdquo;<br>'+hora(r.fecha)+' &middot; '+edad(r.minutos)+
        (r.vigente?'':' &middot; vencido')+'</div>'+
        (r.levantado_hora ? '<div class="lv">Se fue &mdash; avisado '+esc(r.levantado_hora)+
          ': &ldquo;'+esc(r.levantado_texto)+'&rdquo;</div>' : '');
      d.onclick = function(){ acercar(r); };
      lista.appendChild(d);
    });

    if(!vis.length) lista.innerHTML = '<div class="vacio">Nada para mostrar con estos filtros.</div>';

    document.getElementById('k-vig').textContent = REPORTES.filter(function(r){return r.vigente;}).length;
    document.getElementById('k-cam').textContent = REPORTES.filter(function(r){return r.vigente&&r.tipo==='CAMINERA';}).length;
    document.getElementById('k-cho').textContent = REPORTES.filter(function(r){return r.vigente&&r.tipo==='CHOQUE';}).length;
  }

  document.querySelectorAll('.chip').forEach(function(ch){
    var k = ch.dataset.k;
    function sync(){ ch.className = 'chip' + (on[k] ? ' ' + CLASE[k] : ''); }
    sync();
    ch.onclick = function(){
      on[k] = !on[k]; sync();
      if(k==='RUTAS'){ on.RUTAS ? capaRutas.addTo(mapa) : mapa.removeLayer(capaRutas); }
      else pintar();
    };
  });

  var sub = document.getElementById('sub');
  if(!REPORTES.length){
    sub.textContent = 'Sin datos cargados';
    document.getElementById('punto').style.background = '#E24B4A';
  } else {
    var g = D.generado ? new Date(D.generado) : null;
    sub.textContent = g ? ('Actualizado ' + dosd(g.getDate())+'/'+dosd(g.getMonth()+1)+' '+hora(D.generado))
                        : (REPORTES.length + ' reportes');
    if(!REPORTES.filter(function(r){return r.vigente;}).length)
      document.getElementById('punto').style.background = '#6d7789';
  }

  if(!REPORTES.filter(function(r){return r.vigente;}).length){
    on.VENC = true;
    var chVenc = document.querySelector('.chip[data-k="VENC"]');
    if(chVenc) chVenc.className = 'chip on-ven';
  }

  pintar();

  var vig = REPORTES.filter(function(r){ return r.vigente; });
  var enc = vig.length ? vig : REPORTES;
  if(enc.length) mapa.fitBounds(L.latLngBounds(enc.map(function(r){return [r.lat,r.lon];})).pad(.3));

  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && REPORTES.length)
      mapa.fitBounds(L.latLngBounds(REPORTES.map(function(r){return [r.lat,r.lon];})).pad(.2));
  });

  window.addEventListener('resize', function(){ mapa.invalidateSize(); });
})();
</script>
</body>
</html>
