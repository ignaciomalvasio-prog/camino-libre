<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="description" content="Mapa colaborativo de presencia policial en las rutas de la provincia de Cordoba.">
<meta name="theme-color" content="#0f1216">
<title>Camino Libre — rutas de Córdoba</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#0f1216; color:#e8eaee; }
  #app{ display:flex; height:100%; }
  #panel{ width:350px; flex-shrink:0; display:flex; flex-direction:column;
    background:#141920; border-right:1px solid #232a34; }
  #mapa{ flex:1; background:#0f1216; }

  .cab{ padding:16px 18px 13px; border-bottom:1px solid #232a34;
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  h1{ font-size:16px; margin:0 0 3px; font-weight:500; letter-spacing:-.01em; }
  .sub{ font-size:11.5px; color:#7d879a; }
  .punto{ width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:6px; }

  .kpis{ display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:14px 18px; }
  .kpi{ background:#1a212b; border-radius:8px; padding:10px 12px; }
  .kpi .lab{ font-size:10.5px; color:#7d879a; margin-bottom:2px; }
  .kpi .val{ font-size:22px; font-weight:500; font-variant-numeric:tabular-nums; }

  #lista{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 18px 16px; }
  .seccion{ font-size:10.5px; text-transform:uppercase; letter-spacing:.09em;
    padding:10px 0 8px; display:flex; align-items:center; gap:7px; }
  .seccion.act{ color:#4ade80; }
  .seccion.ven{ color:#6d7789; border-top:1px solid #232a34; margin-top:10px; padding-top:14px; }
  .seccion .n{ background:#1a212b; border-radius:10px; padding:1px 7px;
    font-size:10.5px; letter-spacing:0; }

  .item{ padding:11px 12px; margin-bottom:6px; cursor:pointer; transition:.12s;
    background:#1a212b; border-left:3px solid #EF9F27; }
  .item:active{ background:#212a36; }
  .item.act{ background:rgba(74,222,128,.10); border-left-color:#4ade80; }
  .item.ven{ opacity:.55; border-left-color:#4a5260; }
  .item .lugar{ font-size:13.5px; font-weight:500; }
  .item .txt{ font-size:12px; color:#a8b1c0; font-style:italic;
    margin-top:4px; line-height:1.45; }
  .item .meta{ font-size:11px; color:#6d7789; margin-top:4px; }
  .item.act .meta{ color:#4ade80; }
  .item .lv{ font-size:11px; color:#7d879a; margin-top:6px; line-height:1.4;
    border-top:1px solid rgba(255,255,255,.07); padding-top:5px; }
  .vacio{ font-size:12px; color:#5d6675; padding:10px 0; line-height:1.5; }

  .pie{ padding:11px 18px; border-top:1px solid #232a34; font-size:10.5px;
    color:#5d6675; line-height:1.5; }

  #tirador{ display:none; }
  .leaflet-container{ background:#0f1216; font-family:inherit; }
  .leaflet-popup-content-wrapper{ background:#1a212b; color:#e8eaee; border-radius:8px; }
  .leaflet-popup-tip{ background:#1a212b; }
  .leaflet-popup-content{ margin:12px 14px; font-size:13px; line-height:1.55; }
  .pt{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:500; }
  .px{ font-style:italic; color:#a8b1c0; margin:6px 0; }
  .pm{ font-size:11.5px; color:#7d879a; }
  .pl{ font-size:11.5px; color:#7d879a; margin-top:7px;
    border-top:1px solid #2c3542; padding-top:6px; line-height:1.45; }
  .leaflet-bar a{ background:#1a212b; color:#e8eaee; border-bottom-color:#2c3542; }
  .leaflet-bar a:hover{ background:#212a36; }
  .leaflet-control-attribution{ background:rgba(20,25,32,.85); color:#6d7789; font-size:10px; }
  .leaflet-control-attribution a{ color:#8b95a7; }
  .leaflet-control-layers{ background:#1a212b; color:#e8eaee; border:1px solid #2c3542; }
  .leaflet-control-layers-expanded{ padding:8px 12px 8px 8px; font-size:13px; }
  .leaflet-control-scale-line{ background:rgba(20,25,32,.85); border-color:#3d4757; color:#a8b1c0; }

  @media (max-width:820px){
    #app{ flex-direction:column; }
    #mapa{ order:1; flex:1 1 auto; min-height:0; }
    #panel{ order:2; width:100%; height:54vh; max-height:54vh;
      border-right:none; border-top:1px solid #232a34;
      border-radius:14px 14px 0 0; margin-top:-14px; position:relative; z-index:500; }
    #tirador{ display:block; width:38px; height:4px; border-radius:2px;
      background:#3d4757; margin:8px auto 0; }
    .cab{ padding:10px 16px 11px; }
    h1{ font-size:15px; }
    .kpis{ padding:11px 16px; }
    #lista{ padding:0 16px 14px; }
    .pie{ padding:9px 16px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="mapa"></div>
  <div id="panel">
    <div id="tirador"></div>
    <div class="cab">
      <div>
        <h1>Camino Libre</h1>
        <div class="sub" id="sub">Cargando&hellip;</div>
      </div>
      <div class="punto" id="punto"></div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="lab">Activos ahora</div>
        <div class="val" id="k-act" style="color:#4ade80">0</div></div>
      <div class="kpi"><div class="lab">Reportes del d&iacute;a</div>
        <div class="val" id="k-tot">0</div></div>
    </div>
    <div id="lista"></div>
    <div class="pie">
      Un reporte vale 2&nbsp;h desde que lo avisaron. Son reportes de usuarios,
      sin verificar. Ubicaci&oacute;n aproximada. No uses el celular manejando.
    </div>
  </div>
</div>

<script src="datos.js"></script>
<script>
(function(){
  var D = window.DATOS || { generado:null, reportes:[] };
  var TODOS = (D.reportes || []).filter(function(r){ return r.tipo === 'CAMINERA'; });
  TODOS.forEach(function(r, i){ r.id = i; });

  var VIG = TODOS.filter(function(r){ return r.vigente; });
  var VEN = TODOS.filter(function(r){ return !r.vigente; });

  var mapa = L.map('mapa', { zoomControl:false, minZoom:5, maxZoom:19, tap:true })
              .setView([-31.0,-64.05], 8);

  var calles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OpenStreetMap', maxZoom:19, maxNativeZoom:19 });
  var relieve = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OpenStreetMap, SRTM &mdash; OpenTopoMap', maxZoom:17, maxNativeZoom:17 });
  calles.addTo(mapa);

  L.control.zoom({ position:'topright' }).addTo(mapa);
  L.control.layers({ 'Calles':calles, 'Relieve':relieve }, null, { position:'topright' }).addTo(mapa);
  L.control.scale({ position:'bottomleft', imperial:false }).addTo(mapa);

  var capa = L.layerGroup().addTo(mapa);
  var marcas = {};

  function dosd(n){ return (n<10?'0':'')+n; }
  function hora(iso){ var d=new Date(iso); return dosd(d.getHours())+':'+dosd(d.getMinutes()); }
  function edad(m){
    if(m<60) return 'hace '+m+' min';
    var h=Math.floor(m/60);
    if(h<24) return 'hace '+h+' h'+(m%60?' '+(m%60)+' min':'');
    return 'hace '+Math.floor(h/24)+' d';
  }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

  TODOS.forEach(function(r){
    var col = r.vigente ? '#4ade80' : '#5f6672';
    var m = L.circleMarker([r.lat, r.lon], {
      radius: r.vigente ? 10 : 6,
      fillColor: col, color:'#0f1216', weight:2.5,
      fillOpacity: r.vigente ? .95 : .5 });
    m.bindPopup(
      '<div class="pt" style="color:'+col+'">'+
        (r.vigente ? 'Activo ahora' : 'Ya no est&aacute;')+'</div>'+
      '<div style="margin-top:4px"><b>'+esc(r.referencia)+'</b>'+
        (r.sentido ? ' &middot; sentido '+esc(r.sentido) : '')+'</div>'+
      '<div class="px">&ldquo;'+esc(r.texto)+'&rdquo;</div>'+
      '<div class="pm">Avisado '+hora(r.fecha)+' &middot; '+edad(r.minutos)+'</div>'+
      (r.levantado_hora
        ? '<div class="pl">Avisaron que se fue a las '+esc(r.levantado_hora)+
          '<br>&ldquo;'+esc(r.levantado_texto)+'&rdquo;</div>'
        : ''));
    marcas[r.id] = m;
    capa.addLayer(m);
  });

  function acercar(r){
    mapa.flyTo([r.lat, r.lon], 12, { duration:.7 });
    setTimeout(function(){ if(marcas[r.id]) marcas[r.id].openPopup(); }, 720);
  }

  function fila(r, clase){
    var d = document.createElement('div');
    d.className = 'item ' + clase;
    d.innerHTML =
      '<div class="lugar">'+esc(r.referencia)+
        (r.sentido ? ' <span style="color:#7d879a;font-weight:400">&middot; sentido '+esc(r.sentido)+'</span>' : '')+
      '</div>'+
      '<div class="txt">&ldquo;'+esc(r.texto)+'&rdquo;</div>'+
      '<div class="meta">Avisado '+hora(r.fecha)+' &middot; '+edad(r.minutos)+'</div>'+
      (r.levantado_hora
        ? '<div class="lv">Se fue &mdash; avisado '+esc(r.levantado_hora)+
          ': &ldquo;'+esc(r.levantado_texto)+'&rdquo;</div>'
        : '');
    d.onclick = function(){ acercar(r); };
    return d;
  }

  function encabezado(texto, n, clase){
    var h = document.createElement('div');
    h.className = 'seccion ' + clase;
    h.innerHTML = esc(texto) + '<span class="n">' + n + '</span>';
    return h;
  }

  var lista = document.getElementById('lista');

  if(VIG.length){
    lista.appendChild(encabezado('Activos ahora', VIG.length, 'act'));
    VIG.forEach(function(r){ lista.appendChild(fila(r, 'act')); });
  } else {
    lista.appendChild(encabezado('Activos ahora', 0, 'act'));
    var v = document.createElement('div');
    v.className = 'vacio';
    v.textContent = 'Ningún control activo en este momento.';
    lista.appendChild(v);
  }

  if(VEN.length){
    lista.appendChild(encabezado('Ya no están', VEN.length, 'ven'));
    VEN.forEach(function(r){ lista.appendChild(fila(r, 'ven')); });
  }

  document.getElementById('k-act').textContent = VIG.length;
  document.getElementById('k-tot').textContent = TODOS.length;

  var punto = document.getElementById('punto');
  punto.style.background = VIG.length ? '#EF9F27' : '#4ade80';

  var sub = document.getElementById('sub');
  if(!TODOS.length){
    sub.textContent = 'Sin datos cargados';
    punto.style.background = '#E24B4A';
  } else if(D.generado){
    var g = new Date(D.generado);
    sub.textContent = 'Actualizado ' + dosd(g.getDate()) + '/' + dosd(g.getMonth()+1) +
                      ' ' + hora(D.generado);
  }

  var enc = VIG.length ? VIG : TODOS;
  if(enc.length){
    mapa.fitBounds(L.latLngBounds(enc.map(function(r){ return [r.lat, r.lon]; })).pad(0.3));
  }

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && TODOS.length)
      mapa.fitBounds(L.latLngBounds(TODOS.map(function(r){ return [r.lat, r.lon]; })).pad(0.2));
  });

  window.addEventListener('resize', function(){ mapa.invalidateSize(); });
})();
</script>
</body>
</html>
